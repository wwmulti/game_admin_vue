<!-- 左侧菜单栏 -->
<section class="sidebar">
    <div class="user-panel hidden-xs">
        <div style="width: 145px;height: 54px">
            <p style="text-align: center">
                <a>{$server_time_name}</a>
            </p>
            <p style="text-align: center">
                <a id="now_time"></a>
            </p>
        </div>
        <script>
            // 时间戳：1637244864707
            /* 时间戳转换为时间 */
            function getTime(timestamp) {
                timestamp = timestamp ? timestamp : null;
                let date = new Date(timestamp);//时间戳为10位需*1000，时间戳为13位的话不需乘1000
                let Y = date.getFullYear() + '-';
                let M = (date.getMonth() + 1 < 10 ? '0' + (date.getMonth() + 1) : date.getMonth() + 1) + '-';
                let D = (date.getDate() < 10 ? '0' + date.getDate() : date.getDate()) + ' ';
                let h = (date.getHours() < 10 ? '0' + date.getHours() : date.getHours()) + ':';
                let m = (date.getMinutes() < 10 ? '0' + date.getMinutes() : date.getMinutes()) + ':';
                let s = date.getSeconds() < 10 ? '0' + date.getSeconds() : date.getSeconds();
                document.getElementById('now_time').text = Y + M + D + h + m + s;
            }
            let now_date ="{:date('Y-m-d H:i:s')}";
            let nowtime = Date.parse(new Date(now_date).toString());
            let intervalId = setInterval(() => {
                nowtime += 1000;
                getTime(nowtime);
            }, 1000);
            // 恢复setInterval
            function resumeInterval() {
                clearInterval(intervalId);
                intervalId = setInterval(() => {
                    nowtime += 1000;
                    getTime(nowtime);
                }, 1000);
            }
            setInterval(() => {
                nowtime += 1000;
                getTime(nowtime);
                $.ajax({
                    url: "{:url('time_check')}",
                    type: 'get',
                    success: function (res) {
                        nowtime = Date.parse(new Date(res.time).toString());
                        resumeInterval()
                    }
                })
                nowtime += 1000;
                getTime(nowtime);
            }, 10000);
        </script>
    </div>
