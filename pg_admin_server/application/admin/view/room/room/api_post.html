<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('游戏类型')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-type_id"  data-source="room/room/type_id_name" class="form-control selectpage" name="row[type_id]" type="text" value="">
        </div>
    </div>

    <div class="form-group">
       

       
        <label class="control-label col-xs-12 col-sm-2">{:__('所属游戏')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input type="hidden" class="operate" data-name="room_id" value="="/>
            <input id="c-room_id" data-source="room/room/room_list" data-primary-key="id"
                   data-field="name" class="form-control selectpage" name="room_id" type="text"
                   value="">
        </div>
    </div>


    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
