<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">

    <div class="form-group">
        <label class="control-label col-xs-4 col-sm-4">{:__('Seconds')}:</label>
        <div class="col-xs-7 col-sm-7">
            <input id="c-seconds" data-rule="required" min="0" class="form-control" name="row[seconds]" type="number">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-4 col-sm-4">{:__('Stop_second')}:</label>
        <div class="col-xs-7 col-sm-7">
            <input id="c-stop_second" data-rule="required" min="0" class="form-control" name="row[stop_second]" type="number">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-4 col-sm-4">{:__('计算开奖概率(%)')}:</label>
        <div class="col-xs-7 col-sm-7">
            <input id="c-odds" data-rule="required" min="0" class="form-control" name="row[odds]" type="number">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-4 col-sm-4">{:__('排序')}:</label>
        <div class="col-xs-7 col-sm-7">
            <input id="c-weight" data-rule="required" min="0" class="form-control" name="row[weight]" type="number">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-4 col-sm-4">{:__('Status')}:</label>
        <div class="col-xs-7 col-sm-7">
            {:build_radios('row[status]', ['0'=>__('禁用'), '1'=>__('开启')])}
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-4 col-sm-4"></label>
        <div class="col-xs-7 col-sm-7">
            <button type="submit" class="btn btn-primary btn-embossed disabled">{:__('OK')}</button>
        </div>
    </div>
</form>
