<style>
    .profile-avatar-container {
        position: relative;
        width: 100px;
        margin: 0 auto;
    }
    .profile-avatar-container .profile-user-img {
        width: 100px;
        height: 100px;
    }
    .profile-avatar-container .profile-avatar-text {
        display: none;
    }
    .profile-avatar-container:hover .profile-avatar-text {
        display: block;
        position: absolute;
        height: 100px;
        width: 100px;
        background: #444;
        opacity: .6;
        color: #fff;
        top: 0;
        left: 0;
        line-height: 100px;
        text-align: center;
    }
    .profile-avatar-container button {
        position: absolute;
        top: 0;
        left: 0;
        width: 100px;
        height: 100px;
        opacity: 0;
    }
    .panel-body {
        padding-top: 0;
    }
    .box-body{
        padding-top: 0;
    }
    .profile-avatar-container{
        width: 75px;
        margin-bottom: 7px;
    }
    .profile-avatar-container .profile-user-img{
        width: 100%;
        height: 100%;
    }
    .profile-avatar-container button{
        width: 75px;
        height: 75px;
    }
    .profile-avatar-container:hover .profile-avatar-text {
        display: block;
        position: absolute;
        width: 75px;
        height: 75px;
        background: #444;
        opacity: .6;
        color: #fff;
        top: 0;
        left: 0;
        line-height: 75px;
        text-align: center;
        font-size: 12px;
    }
    #qrcode{
        width: 250px;
        height: 250px;
        border: 15px solid #d9d9d9;
    }
    #qrcode img{
        width: 100%;
        height: 100%;
        border: 15px solid #fff
    }
</style>
<div class="row animated fadeInRight">
    <div class="col-md-12">
        <div class="col-md-6">
            <div class="box box-primary">
                <div class="panel-heading">
                    <i class="fa fa-newspaper-o"></i> {:__('Profile')}
                </div>
                <div class="panel-body">
                    <form id="update-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="{:url('general.profile/update')}">
                        {:token()}
                        <input type="hidden" id="c-avatar" name="row[avatar]" value="{$admin.avatar|htmlentities}"/>
                        <div class="box-body box-profile">
                            <div class="form-group">
                                <div class="profile-avatar-container">
                                    <img class="profile-user-img img-responsive img-circle" src="{$admin.avatar|cdnurl|htmlentities}" alt="">
                                    <div class="profile-avatar-text img-circle">{:__('Click to edit')}</div>
                                    <button type="button" id="faupload-avatar" class="faupload" data-input-id="c-avatar"><i class="fa fa-upload"></i> {:__('Upload')}
                                    </button>
                                </div>
                                <h3 class="profile-username text-center">{$admin.nickname|htmlentities}</h3>
                            </div>
                            <div class="form-group">
                                <label for="username" class="control-label col-xs-3 col-sm-3">{:__('Username')}:</label>
                                <div class="col-xs-8 col-sm-8">
                                    <input type="text" class="form-control" id="username" name="row[username]" value="{$admin.username|htmlentities}" disabled/>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="nickname" class="control-label col-xs-3 col-sm-3">{:__('Nickname')}:</label>
                                <div class="col-xs-8 col-sm-8">
                                    <input type="text" class="form-control" id="nickname" name="row[nickname]" value="{$admin.nickname|htmlentities}" data-rule="required"/>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="password" class="control-label col-xs-3 col-sm-3">{:__('Password')}:</label>
                                <div class="col-xs-8 col-sm-8">
                                    <input type="password" class="form-control" id="password" placeholder="{:__('Leave password blank if dont want to change')}" autocomplete="new-password" name="row[password]" value="" data-rule="password"/>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="password" class="control-label col-xs-3 col-sm-3">{:__('谷歌验证开关')}:</label>
                                <div class="col-xs-8 col-sm-8">
                                    {:build_radios('row[google_switch]', ['0'=>__('关闭'), '1'=>__('开启')], $admin.google_switch)}
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-xs-12 col-sm-2"></label>
                                <div class="col-xs-8 col-sm-8">
                                    <button type="submit" class="btn btn-primary">{:__('Submit')}</button>
                                    <button type="reset" class="btn btn-default">{:__('Reset')}</button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        {if $admin.google_switch == 1}
        <div class="col-md-6">
            <div class="box box-primary">
                <div class="panel-heading">
                    <i class="fa fa-qrcode"></i> 绑定谷歌验证码
                </div>
                <div class="panel-body">
                    <div class="box-body box-profile">
                        <div class="form-group" style="width: 100%;height: 50px;">
                            <label class="control-label col-xs-12 col-sm-2">{:__('谷歌身份码')}:</label>
                            <div class="col-xs-12 col-sm-4">
                                <input type="text" class="form-control" value="{$admin.google_verify|htmlentities}" disabled style="width: 250px"/>
                            </div>
                        </div>
                        <div class="form-group" style="width: 100%;height: 300px;margin-bottom:0;">
                            <label class="control-label col-xs-12 col-sm-2">{:__('扫描二维码绑定')}:</label>
                            <div class="col-xs-12 col-sm-4">
                                <div id="qrcode"></div>
    <!--                            <img style="width: 250px;height: 250px;margin-left: 20px;border: 15px solid #d9d9d9" src="$qrCodeUrl">-->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        {/if}
    </div>
    <div class="col-md-12">
        <div class="panel panel-default panel-intro panel-nav">
            <div class="panel-heading">
                <ul class="nav nav-tabs">
                    <li class="active"><a href="#one" data-toggle="tab"><i class="fa fa-list"></i> {:__('操作日志')}</a>
                    </li>
                </ul>
            </div>
            <div class="panel-body">
                <div id="myTabContent" class="tab-content">
                    <div class="tab-pane fade active in" id="one">
                        <div class="widget-body no-padding">
                            <div id="toolbar" class="toolbar">
                                {:build_toolbar('refresh')}
                            </div>
                            <table id="table" class="table table-striped table-bordered table-hover table-nowrap" width="100%"></table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="/assets/js/qrcode.min.js"></script>
<script>
    // 创建一个二维码元素
    var qrcode = new QRCode(document.getElementById("qrcode"), {
        text: "{$qrCodeUrl}",
        width: 128,
        height: 128,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });
</script>
