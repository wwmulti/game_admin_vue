<script src="../../../../../public/assets/libs/bootstrap-select/dist/js/bootstrap-select.js"></script>

<form id="add-form" class="form-horizontal" role="form">
    <div class="panel panel-info">
        <div class="panel-heading">
            <h3 class="panel-title">模拟客户端返奖</h3>
        </div>
        <div class="panel-body">

            <div>
                <div class="form-group">
                    <label class="control-label col-xs-3 col-sm-3">{:__('operator_token')}:</label>
                    <div class="col-xs-3 col-sm-3">
                        <input class="form-control" spellcheck="false" v-model="form.operator_token" type="text">
                    </div>
                </div>

                <div class="form-group">
                    <label class="control-label col-xs-3 col-sm-3">{:__('secret')}:</label>
                    <div class="col-xs-3 col-sm-3">
                        <input class="form-control" spellcheck="false" v-model="form.secret" type="text">
                    </div>
                </div>

                <div class="form-group">
                    <label class="control-label col-xs-3 col-sm-3">{:__('user_id')}:</label>
                    <div class="col-xs-3 col-sm-3">
                        <input class="form-control" v-model="form.user_id" type="text">
                    </div>
                </div>

                <div class="form-group">
                    <label class="control-label col-xs-3 col-sm-3">{:__('user_name')}:</label>
                    <div class="col-xs-3 col-sm-3">
                        <input class="form-control" v-model="form.user_name" type="text">
                    </div>
                </div>

                <div class="form-group">
                    <label class="control-label col-xs-3 col-sm-3">{:__('rtp')}:</label>
                    <div class="col-xs-3 col-sm-3">
                        <input class="form-control" v-model="form.rtp" type="number">
                    </div>
                </div>

                <div class="form-group layer-footer">
                    <label class="control-label col-xs-12 col-sm-3"></label>
                    <div class="col-xs-12 col-sm-8">
                        <button type="button" class="btn btn-success btn-embossed" @click="CreateUser()" :disabled="isDataRunning">{:__('创建用户')}
                        </button>
                        <button type="button" class="btn btn-success btn-embossed" v-if="user_id" @click="GetUserInfo()">{:__('获取用户信息')}
                        </button>
                    </div>
                </div>
            </div>

            <div v-if="user_id">
                <div class="form-group">
                    <label class="control-label col-xs-3 col-sm-3">{:__('游戏类型')}:</label>
                    <div class="col-xs-3 col-sm-3">
                        <select class="selectpicker show-tick form-control" required data-live-search="true"
                            v-model="form.type_index" @change="GetGames()">
                            <option value="">请选择房间</option>
                            <option :value="index" v-for="(item_type, index) in item_types">{{item_type}}</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="control-label col-xs-3 col-sm-3">{:__('语言')}:</label>
                    <div class="col-xs-3 col-sm-3">
                        <select class="selectpicker show-tick form-control" required data-live-search="true" v-model="language">
                            <option value="">请选择房间</option>
                            <option :value="k" v-for="(language, k) in languages">{{language}}</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="control-label col-xs-3 col-sm-3">{:__('游戏')}:</label>
                    <div class="col-xs-3 col-sm-3">
                        <select class="selectpicker show-tick form-control" required data-live-search="true" v-model="game_code">
                            <!-- <option value="">请选择房间</option> -->
                            <option :value="game.code"  v-for="game in game_list">{{game.name}}</option>
                        </select>
                    </div>
                </div>

                <div class="form-group layer-footer">
                    <label class="control-label col-xs-12 col-sm-3"></label>
                    <div class="col-xs-12 col-sm-8">
                        <button type="button" class="btn btn-success btn-embossed" @click="GameUrl()" :disabled="isDataRunning">{:__('打开游戏')}
                        </button>
                        <button type="button" class="btn btn-success btn-embossed" v-if="user_id" @click="GameLauchUrl('formName')" :disabled="isDataRunning">{:__('获取游戏打开html')}
                        </button>
                        <button type="button" class="btn btn-warning btn-embossed" :disabled="isDataRunning" @click="CheckGames">{:__('游戏检测')}
                        </button>
                        <button type="button" class="btn btn-warning btn-embossed" @click="GetCheckGames">{:__('查看检测结果')}
                        </button>
                    </div>
                </div>

                <iframe v-show="showIframe" id="myFrame" width="399" height="599"></iframe>
            </div>

            <div v-if="user_id">
                <div class="form-group">
                    <label class="control-label col-xs-3 col-sm-3">{:__('rtp')}:</label>
                    <div class="col-xs-3 col-sm-3">
                        <input class="form-control" v-model="form.rtp" type="number">
                    </div>
                </div>
                
                <div class="form-group layer-footer">
                    <label class="control-label col-xs-12 col-sm-3"></label>
                    <div class="col-xs-12 col-sm-8">
                        <button type="button" class="btn btn-success btn-embossed" @click="SetUserRtp()">{:__('设置rtp')}
                        </button>
                    </div>
                </div>
            </div>

            <div v-if="user_id">
                <div class="form-group">
                    <label class="control-label col-xs-3 col-sm-3">{:__('每轮局数')}:</label>
                    <div class="col-xs-3 col-sm-3">
                        <input class="form-control" v-model="nums" type="number">
                    </div>
                </div>

                <div class="form-group">
                    <label class="control-label col-xs-3 col-sm-3">{:__('设置轮次')}:</label>
                    <div class="col-xs-3 col-sm-3">
                        <input class="form-control" v-model="rounds" type="number">
                    </div>
                </div>
                
                <div class="form-group layer-footer">
                    <label class="control-label col-xs-12 col-sm-3"></label>
                    <div class="col-xs-12 col-sm-8">
                        <button type="button" class="btn btn-success btn-embossed" :disabled="isDataRunning" @click="StartData()">{:__('数据开跑')}
                        </button>
                        <button type="button" v-if="!isDataRunning" class="btn btn-warning btn-embossed" @click="GetResults()">{:__('获取结果')}
                        </button>
                        <button type="button" v-if="isDataRunning" class="btn btn-warning btn-embossed">
                            <i class="fa fa-spinner fa-spin"></i> 执行中...
                        </button>
                        <div class="help-block" style="color: #d9534f; margin-top: 10px;">
                            <i class="fa fa-warning"></i> 数据开跑时请勿重复点击或打开游戏,会影响当前token被覆盖过期,导致跑数据执行失败
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</form>

<script src="/assets/libs/jquery/dist/jquery.min.js"></script>
<script src="/assets/libs/fastadmin-layer/dist/layer.js"></script>
<script src="/assets/js/vue.js"></script>
<script src="/assets/js/md5.js"></script>
<script src="/assets/js/axios.min.js"></script>

<script>

    var loadingIndex;
    var intervalKey; //轮询key
    var app = new Vue({
        el: '#add-form',
        data() {
            return {
                form: {
                    operator_token: '1lhdibfzzepmviiyfsfdqeu2nzw2jhc2',
                    secret: 'uvtkutdjkdxzqpabe026o7fmrianmo_z',
                    user_id: '',
                    user_name: '',
                    ts: 0,
                    sign: '',
                    type_index: 2, //pg
                    type: 'pg', //pg
                    rtp: 0
                },
                user_id: '',
                user_token: '',
                game_code: '',
                language: 'pt',
                game_types_list: {$game_types_list},
                game_list: [],
                showIframe: false,
                //跑数据局数
                nums: 1,
                //轮次
                rounds: 1,
                //游戏类型
                item_types: JSON.parse('{:json_encode(config("constant.game_types"))}'),
                //语言
                languages: JSON.parse('{:json_encode(config("constant.languages"))}'),
                //线上版本设置空
                prefixUrl: '{:config("constant.page_domain")}',

                //数据是否正在执行
                isDataRunning: false,
                //执行结果
                run_result: {
                    id: null,
                },
                get_result: {
                    rtp: '',
                },

                table_data: [
                ],

                //验证表单
                ruleForm: {
                    game_code: '',
                },
                rules: {
                    game_code: [
                        { required: true, message: '请选择游戏', trigger: 'change' }
                    ]
                }
            }
        },
        created: function () {
            this.GetGames();
            this.InitUser();
        },
        computed: {

        },
        methods: {
            InitUser() {
                const randomNumber = Math.floor(100000000 + Math.random() * 900000000);
                this.form.user_id = `user_${randomNumber}`;
                this.form.user_name = `user_${randomNumber}`;
            },
            CreateUrl(uri) {
                return this.prefixUrl + uri;
            },
            CreateUser() {
                if (!this.form.user_id || !this.form.user_name) {
                    layer.msg('请填写user_id和user_name', {icon:2});
                    return;
                }

                this.form.ts = Math.floor(Date.now() / 1000);
                let data = {
                    operator_token: this.form.operator_token,
                    rtp: this.form.rtp * 1,
                    ts: this.form.ts,
                    user_id: this.form.user_id,
                    user_name: this.form.user_name,
                    key: this.form.secret
                };
                data.sign = md5(new URLSearchParams(data).toString());
                delete data.key;

                loadingIndex = layer.msg('加载中', {icon: 16,shade: 0.01});
                axios.post(this.CreateUrl('/api/web/user_session'), data).then(res => {
                    const res_data = res.data.data;

                    if (res.data.code != 0) {
                        layer.close(loadingIndex);
                        layer.msg('创建用户失败：' + res.data.message, {icon:2});
                        return;
                    }
                    layer.close(loadingIndex);
                    layer.msg('创建用户成功', {icon:1});
                    this.user_id = res_data.user_id;
                    this.user_token = res_data.token;
                    this.form.rtp = res_data.rtp;
                }).catch(err => {
                    layer.close(loadingIndex);
                    layer.msg('创建用户请求失败:' + err.message || '', {icon:2});
                });
            },

            GetGames() {
                this.game_list = this.game_types_list[this.form.type_index] || [];
                this.form.type = this.item_types[this.form.type_index];
                this.game_code = this.game_list[0].code;
                /* this.form.ts = Math.floor(Date.now() / 1000);
                let data = {
                    operator_token: this.form.operator_token,
                    ts: this.form.ts,
                    type: this.form.type,
                    key: this.form.secret,
                };
                data.sign = md5(new URLSearchParams(data).toString())
                delete data.key;

                axios.post(this.CreateUrl('/api/web/game_list'), data).then(res => {
                    let res_data = res.data.data

                    if (res.data.code != 0) {
                        layer.msg('失败', {icon:2});
                        return;
                    }

                    this.game_list = res_data
                }).catch(err => {
                    layer.msg('失败', {icon:2});
                }) */
            },

            //显示游戏名
            doGameList(code) {
                const item = this.game_list.find(item => item.code == code);
                return item ? item.name : code;
            },

            GameUrl() {
                if (!this.user_id || !this.user_token) {
                    layer.msg('请先创建用户', {icon:2});
                    return;
                }

                if (!this.game_code) {
                    layer.msg('请选择游戏', {icon:2});
                    return;
                }

                this.form.ts = Math.floor(Date.now() / 1000);
                let data = {
                    game_code: this.game_code,
                    language: this.language,
                    operator_token: this.form.operator_token,
                    ts: this.form.ts,
                    type: this.form.type,
                    user_id: this.user_id,
                    user_token: this.user_token,
                    key: this.form.secret
                };
                // console.log('data', data);

                data.sign = md5(new URLSearchParams(data).toString())
                delete data.key

                axios.post(this.CreateUrl('/api/web/game_url'), data).then(res => {
                    let res_data = res.data.data

                    if (res.data.code != 0) {
                        layer.msg('失败:' + res.data?.message ?? '', {icon:2});
                        return;
                    }
                    layer.msg('打开新页面', {icon:1});
                    console.log('res_data.url', res_data.url);
                    window.open(res_data.url, "blank")
                }).catch(err => {
                    layer.msg('失败', {icon:2});
                })
            },

            GameLauchUrl(formName) {
                if (!this.user_token || !this.user_id) {
                    layer.msg('请先创建用户', {icon:2});
                    return
                }

                if (!this.game_code) {
                    layer.msg('请选择游戏', {icon:2});
                    return;
                }

                /* this.$refs[formName].validate((valid) => {
                    if (!valid) {
                        layer.msg('请填写完整表单', {icon:2});
                        return false;
                    }
                }) */

                this.form.ts = Math.floor(Date.now() / 1000)
                let data = {
                    game_code: this.game_code,
                    language: this.language,
                    operator_token: this.form.operator_token,
                    ts: this.form.ts,
                    type: this.form.type,
                    user_id: this.user_id,
                    user_token: this.user_token,
                    key: this.form.secret,
                }
                console.log('data', data);
                data.sign = md5(new URLSearchParams(data).toString())
                delete data.key

                axios.post(this.CreateUrl('/api/web/get_launch_url'), data).then(res => {
                    this.showIframe = true
                    let res_data = res.data.data
                    console.log('res_data', res_data)

                    const iframe = document.getElementById("myFrame");
                    const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

                    iframeDoc.open();
                    iframeDoc.write(res.data);
                    iframeDoc.close();

                }).catch(err => {
                    layer.msg('失败', {icon:2});
                })
            },

            GetUserInfo() {
                this.form.ts = Math.floor(Date.now() / 1000);
                let data = {
                    operator_token: this.form.operator_token,
                    ts: this.form.ts,
                    user_id: this.user_id,
                    key: this.form.secret,
                }
                data.sign = md5(new URLSearchParams(data).toString())
                delete data.key

                loadingIndex = layer.msg('加载中', { icon: 16, shade: 0.01 });
                axios.post(this.CreateUrl('/api/web/user_info'), data).then(res => {
                    let res_data = res.data.data

                    if (res.data.code != 0) {
                        layer.close(loadingIndex);
                        layer.msg('失败', {icon:2});
                        return;
                    }

                    layer.close(loadingIndex);
                    layer.alert(JSON.stringify(res_data));
                    this.form.rtp = res_data.rtp

                }).catch(err => {
                    layer.close(loadingIndex);
                    layer.msg('失败', {icon:2});
                })
            },

            SetUserRtp() {
                if (this.form.rtp > 150) {
                    layer.msg('rtp不能大于150', {icon:2});
                    return;
                }

                this.form.ts = Math.floor(Date.now() / 1000);
                let data = {
                    operator_token: this.form.operator_token,
                    rtp: this.form.rtp * 1,
                    ts: this.form.ts,
                    user_id: this.form.user_id,
                    key: this.form.secret,
                }
                data.sign = md5(new URLSearchParams(data).toString())
                delete data.key

                axios.post(this.CreateUrl('/api/web/set_user_rtp'), data).then(res => {
                    let res_data = res.data.data

                    if (res.data.code != 0) {
                        layer.msg('失败', {icon:2});
                        return;
                    }

                    layer.msg("设置成功，档位：" + res_data.rtp, {icon:1});
                    this.form.rtp = res_data.rtp

                }).catch(err => {
                    layer.msg('失败', {icon:2});
                })
            },

            StartData() {
                if (!this.user_id || !this.user_token) {
                    layer.msg('请先创建用户', {icon:2});
                    return;
                }

                if (!this.game_code) {
                    layer.msg('请选择游戏', {icon:2});
                    return;
                }

                if (this.nums < 1 || this.rounds < 1) {
                    layer.msg('局数和轮数至少为1', {icon:2});
                    return;
                }

                this.form.ts = Math.floor(Date.now() / 1000);
                let data = {
                    game_code: this.game_code,
                    language: this.language,
                    operator_token: this.form.operator_token,
                    ts: this.form.ts,
                    type: this.form.type,
                    user_id: this.user_id,
                    user_token: this.user_token,
                    key: this.form.secret
                };
                console.log('data', data);

                // 保存数据
                let dataSave = JSON.parse(JSON.stringify(data));
                dataSave.nums = this.nums
                dataSave.rounds = this.rounds
                dataSave.rtp = this.form.rtp
                dataSave.type_id = this.form.type_index
                dataSave.show_user_id = this.form.user_id
                dataSave.user_name = this.form.user_name
                // console.log('dataSave', dataSave);

                data.sign = md5(new URLSearchParams(data).toString())
                delete data.key

                loadingIndex = layer.msg('加载中', { icon: 16, shade: 0.01 });
                axios.post(this.CreateUrl('/api/web/game_url'), data).then(async res => {
                    let res_data = res.data.data

                    if (res.data.code != 0) {
                        layer.close(loadingIndex);
                         layer.msg('失败:' + res.data?.message ?? '', { icon: 2 });
                        return;
                    }
                    /* this.$message.error('打开新页面');
                    console.log('res_data.url', res_data.url);
                    window.open(res_data.url, "blank") */

                    const gameUrl = res_data.url;
                    const run = await axios.post('imitatePost', { game_url: gameUrl, nums: this.nums, rounds: this.rounds, user_id: this.user_id, rtp: this.form.rtp, type_id: this.form.type_index, id: 0, save_data: dataSave });
                    if (run.data.code != 0) {
                        layer.close(loadingIndex);
                        layer.msg('失败：' + run.data.message, {icon:2});
                        return;
                    } else {
                        this.run_result = run.data.data;
                        this.isDataRunning = true; // 开始执行，禁用按钮
                        layer.close(loadingIndex);
                        layer.msg('执行成功，请勿刷新页面，稍后点击获取结果按钮', {icon:1});
                        this.RefreshTable();

                        //开始轮询
                        let run_num = 0;
                        // 确保定时器变量为空后再设置新的定时器
                        if (intervalKey) {
                            clearInterval(intervalKey);
                        }
                        intervalKey = setInterval(async () => {
                            if (run_num > 180) { //最多轮询3分钟
                                clearInterval(intervalKey);
                                intervalKey = null;
                                this.isDataRunning = false; // 超时也要恢复按钮
                                layer.msg('轮询超时，请刷新表格获取结果', {icon:2}, 2000);
                                this.RefreshTable();
                                run_num = 0;
                                return;
                            }
                            const poll = await axios.get('pollStatus?id=' + this.run_result.id);
                            if (poll.data.data.status >= 1 && poll.data.data.status != 4) {
                                this.isDataRunning = false; // 执行完成，恢复按钮
                                if (poll.data.data.status == 1) {
                                    layer.msg('数据跑取完成，请点击获取结果按钮', { icon: 1 }, 2000);
                                } else if (poll.data.data.status == 2) {
                                    layer.msg('跑数据执行失败！', { icon: 2 }, 2000);
                                } else if (poll.data.data.status == 3) {
                                    layer.msg('跑数据执行超时！', { icon: 2 }, 2000);
                                }
                                this.RefreshTable();
                                clearInterval(intervalKey);
                                intervalKey = null;
                                return;
                            }
                            run_num +=  1;
                        }, 2000);

                    }

                }).catch(err => {
                    if (intervalKey) {
                        clearInterval(intervalKey);
                        intervalKey = null;
                    }
                    this.isDataRunning = false; // 出错也要恢复按钮
                    layer.close(loadingIndex);
                    layer.msg('失败', {icon:2});
                })
            },

            FixData(row) {
                if (this.isDataRunning) {
                    layer.msg('有执行中的任务，请稍后再试', { icon: 2 }, 2000);
                    return
                }
                params = JSON.parse(row.save_data);

                let rounds = Number(params.rounds) - Number(row.sus);
                if (params.nums < 1 || rounds < 1) {
                    layer.msg('局数和轮数至少为1', { icon: 2 });
                    return;
                }

                // 显示执行表单
                this.form.user_id = params.show_user_id
                this.form.user_name = params.user_name
                this.form.rtp = params.rtp
                this.form.type_index = params.type_id
                this.form.operator_token = params.operator_token
                this.form.secret = params.key
                this.form.type = params.type
                this.user_id = params.user_id
                this.user_token = params.user_token
                this.game_code = params.game_code
                this.language = params.language
                this.nums = params.nums
                this.rounds = rounds

                if (!params.user_id || !params.user_token) {
                    layer.msg('用户没创建', { icon: 2 });
                    return;
                }

                if (!params.game_code) {
                    layer.msg('游戏没选择', { icon: 2 });
                    return;
                }
                
                let data = {
                    game_code: params.game_code,
                    language: params.language,
                    operator_token: params.operator_token,
                    ts: Math.floor(Date.now() / 1000),
                    type: params.type,
                    user_id: params.user_id,
                    user_token: params.user_token,
                    key: params.key
                };

                data.sign = md5(new URLSearchParams(data).toString())
                delete data.key

                loadingIndex = layer.msg('加载中', { icon: 16, shade: 0.01 });
                axios.post(this.CreateUrl('/api/web/game_url'), data).then(async res => {
                    let res_data = res.data.data

                    if (res.data.code != 0) {
                        layer.close(loadingIndex);
                         layer.msg('失败:' + res.data?.message ?? '', { icon: 2 });
                        return;
                    }
                    /* this.$message.error('打开新页面');
                    console.log('res_data.url', res_data.url);
                    window.open(res_data.url, "blank") */

                    const gameUrl = res_data.url;
                    const run = await axios.post('imitatePost', { game_url: gameUrl, nums: params.nums, rounds: rounds, user_id: params.user_id, rtp: params.rtp, type_id: params.type_id, id: row.id, save_data: {} });
                    if (run.data.code != 0) {
                        layer.close(loadingIndex);
                        layer.msg('失败：' + run.data.message, { icon: 2 });
                        return;
                    } else {
                        this.run_result = run.data.data;
                        this.isDataRunning = true; // 开始执行，禁用按钮
                        layer.close(loadingIndex);
                        layer.msg('执行成功，请勿刷新页面，稍后点击获取结果按钮', { icon: 1 });
                        this.RefreshTable();

                        //开始轮询
                        let run_num = 0;
                        // 确保定时器变量为空后再设置新的定时器
                        if (intervalKey) {
                            clearInterval(intervalKey);
                        }
                        intervalKey = setInterval(async () => {
                            if (run_num > 180) { //最多轮询3分钟
                                clearInterval(intervalKey);
                                intervalKey = null;
                                this.isDataRunning = false; // 超时也要恢复按钮
                                layer.msg('轮询超时，请刷新表格获取结果', { icon: 2 }, 2000);
                                this.RefreshTable();
                                run_num = 0;
                                return;
                            }
                            const poll = await axios.get('pollStatus?id=' + this.run_result.id);
                            if (poll.data.data.status != 4) {
                                this.isDataRunning = false; // 执行完成，恢复按钮
                                if (poll.data.data.status == 1) {
                                    layer.msg('数据修复跑取完成，请点击获取结果按钮', { icon: 1 }, 2000);
                                } else if (poll.data.data.status == 2) {
                                    layer.msg('数据修复执行失败！', { icon: 2 }, 2000);
                                } else if (poll.data.data.status == 3) {
                                    layer.msg('数据修复执行超时！', { icon: 2 }, 2000);
                                }
                                this.RefreshTable();
                                clearInterval(intervalKey);
                                intervalKey = null;
                                return;
                            }
                            run_num += 1;
                        }, 2000);

                    }

                }).catch(err => {
                    if (intervalKey) {
                        clearInterval(intervalKey);
                        intervalKey = null;
                    }
                    this.isDataRunning = false; // 出错也要恢复按钮
                    layer.close(loadingIndex);
                    layer.msg('失败', { icon: 2 });
                })
            },

            RefreshTable() {
                if (typeof window.Controller !== 'undefined' && typeof window.Controller.api !== 'undefined' && typeof window.Controller.api.refreshTable === 'function') {
                    setTimeout(() => {
                        window.Controller.api.refreshTable();
                    }, 3000);
                } else {
                    console.log('Controller or refreshTable not found');
                }
            },

            GetResults() {
                if (!this.run_result.id) {
                    layer.msg('请先执行跑数据', {icon:2});
                    return;
                }

                layer.open({
                    type: 2,
                    title: '获取结果',
                    shadeClose: true,
                    area: ['950px', '950px'],
                    content: 'getResult?id=' + this.run_result.id
                });
            },

            CheckGames() {
                if (!this.user_id || !this.user_token) {
                    layer.msg('请先创建用户', { icon: 2 });
                    return;
                }

                this.form.ts = Math.floor(Date.now() / 1000);
                let data = {
                    game_code: this.game_code,
                    language: this.language,
                    operator_token: this.form.operator_token,
                    ts: this.form.ts,
                    type: this.form.type,
                    user_id: this.user_id,
                    user_token: this.user_token,
                    key: this.form.secret
                };

                axios.post('checkGames', data).then(res => {
                    if (res.data.code != 0) {
                        layer.msg('执行失败:' + res.data.message, {icon:2});
                        return;
                    } else {
                        layer.msg('执行成功,稍后点击查看按钮查看执行结果', {icon:1});
                    }
                })
                
            },

            GetCheckGames() {
                layer.open({
                    type: 2,
                    title: '检测结果',
                    shadeClose: true,
                    area: ['950px', '950px'],
                    content: 'getCheckGames?type=' + this.form.type
                });
            }
        }
    });
</script>
